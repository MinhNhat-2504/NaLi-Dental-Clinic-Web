services:
  web:
    restart: unless-stopped
    ports: []
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  ai_service:
    restart: unless-stopped
    ports: []
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  db:
    restart: unless-stopped
    ports: []
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web]
