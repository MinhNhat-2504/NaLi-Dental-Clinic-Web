services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-nali_dental}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - flask_db_data:/var/lib/mysql
      - ./nali_dental_schema_REAL.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12

  flask_web:
    build:
      context: .
      dockerfile: flask_app/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTO_CREATE_SCHEMA: "0"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-nali_dental}
      AI_SERVICE_URL: ${AI_SERVICE_URL:?Set AI_SERVICE_URL to the public AI service URL}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
    volumes:
      - ./deploy/flask-nginx-http.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      flask_web:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  flask_db_data:
