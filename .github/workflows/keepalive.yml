# ============================================================
#  Giữ web + AI service "thức" trong giờ làm việc (Render free ngủ sau 15 phút).
#  08:00–18:59 giờ VN (01–11 UTC), mỗi 14 phút → ~11h/ngày/service ≈ 680 giờ/tháng cho 2 service,
#  vẫn dưới hạn 750 giờ free của Render. Ngoài giờ này server ngủ, lần đầu mở chờ ~30-60s.
# ============================================================
name: Giữ server thức (giờ hành chính)

on:
  schedule:
    - cron: "*/14 1-11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping web + AI
        run: |
          for u in https://nali-dental-web.onrender.com/healthz https://nali-dental-ai.onrender.com/health; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 120 "$u" || echo 000)
            echo "$u -> $code"
          done
