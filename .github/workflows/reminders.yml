# ============================================================
#  Cron 0đ: mỗi sáng gọi web NALI để gửi email nhắc lịch hẹn ngày mai.
#  Render free không có cron -> dùng lịch của GitHub Actions (miễn phí).
#
#  Cần 2 secret trong repo (Settings -> Secrets and variables -> Actions):
#    SITE_URL   = https://nali-dental-web.onrender.com
#    CRON_TOKEN = trùng với biến CRON_TOKEN trên Render (service nali-dental-web)
# ============================================================
name: Nhắc lịch hẹn (email trước 24h)

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 08:00 giờ Việt Nam, mỗi ngày
  workflow_dispatch:         # cho phép bấm "Run workflow" để thử ngay

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
    steps:
      - name: Kiểm tra secret
        run: |
          # Bỏ khoảng trắng/xuống dòng thừa lỡ dán vào
          SITE_URL="$(printf '%s' "$SITE_URL" | tr -d '[:space:]')"
          SITE_URL="${SITE_URL%/}"
          CRON_TOKEN="$(printf '%s' "$CRON_TOKEN" | tr -d '[:space:]')"
          echo "SITE_URL nhận được: '${SITE_URL}' (dài ${#SITE_URL} ký tự)"
          echo "CRON_TOKEN: dài ${#CRON_TOKEN} ký tự"
          case "$SITE_URL" in
            https://*.onrender.com|https://*) ;;
            *) echo "::error::Secret SITE_URL phải là link dạng https://nali-dental-web.onrender.com (đang là '${SITE_URL}')"; exit 1;;
          esac
          [ -n "$CRON_TOKEN" ] || { echo "::error::Secret CRON_TOKEN đang trống"; exit 1; }
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "CRON_TOKEN=$CRON_TOKEN" >> "$GITHUB_ENV"

      - name: Đánh thức web (Render free ngủ sau 15 phút)
        run: curl -s -o /dev/null -m 90 "$SITE_URL/" || true

      - name: Gọi endpoint gửi nhắc lịch
        run: |
          set +e
          code=$(curl -s -o out.json -w "%{http_code}" -m 120 -X POST \
            -H "X-Cron-Token: $CRON_TOKEN" "$SITE_URL/api/cron/reminders")
          rc=$?
          echo "curl exit=$rc, HTTP $code"; cat out.json 2>/dev/null; echo
          if [ "$code" = "401" ]; then echo "::error::401 = CRON_TOKEN trên GitHub KHÁC với CRON_TOKEN trên Render (Environment). Dán lại cho trùng."; fi
          [ "$code" = "200" ]
