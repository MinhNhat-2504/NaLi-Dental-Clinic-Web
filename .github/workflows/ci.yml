# ============================================================
#  CI — chạy kiểm thử tự động mỗi lần push / pull request.
#  Flask: pytest (SQLite in-memory, không cần MySQL).
#  AI service: test_agent.py (offline, không cần API key).
# ============================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * 1"        # thứ Hai 09:00 VN: eval backend Gemini (quota free tính theo ngày nên không chạy mỗi push)
  workflow_dispatch:           # bấm "Run workflow" để đo Gemini bất cứ lúc nào

jobs:
  flask-tests:
    name: Flask · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flask_app/requirements.txt
      - name: Cài thư viện
        run: pip install -r flask_app/requirements.txt
      - name: Chạy pytest
        working-directory: flask_app
        env:
          PYTHONUTF8: "1"
        run: pytest -q

  ai-service-tests:
    name: AI service · test offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_service/requirements.txt
      - name: Cài thư viện
        run: pip install -r ai_service/requirements.txt
      - name: Chạy test_agent.py
        working-directory: ai_service
        env:
          PYTHONUTF8: "1"
          LLM_BACKEND: offline
        run: python test_agent.py
      - name: Đo chất lượng chatbot (30 câu chuẩn, offline, chấm keyword)
        working-directory: ai_service
        env:
          PYTHONUTF8: "1"
          LLM_BACKEND: offline
          DB_HOST: 127.0.0.1
          DB_PORT: "1"
        run: python eval_agent.py --min 80 --history

  ai-eval-gemini:
    # Đo backend Gemini và chấm bằng LLM-as-judge. Chỉ chạy theo lịch tuần hoặc bấm tay, KHÔNG chạy mỗi push:
    # gói free của Gemini giới hạn theo NGÀY cho từng model (gemini-3.6-flash chỉ 20 lượt/ngày, dùng chung với
    # chatbot trên production). Mặc định đo bằng model lite (hạn mức cao hơn); đổi qua Variables
    # GEMINI_EVAL_MODEL / GEMINI_JUDGE_MODEL nếu muốn. Cần secret GEMINI_API_KEY; không có thì tự bỏ qua.
    # continue-on-error: free tier có thể trả 429; điểm thấp hiện cảnh báo trong Job Summary, không chặn merge.
    name: AI service · eval Gemini (LLM-as-judge)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_EVAL_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_JUDGE_MODEL: ${{ vars.GEMINI_JUDGE_MODEL || 'gemini-3.5-flash-lite' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_service/requirements.txt
      - name: Cài thư viện
        if: env.GEMINI_API_KEY != ''
        run: pip install -r ai_service/requirements.txt
      - name: Eval Gemini + LLM-as-judge
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        working-directory: ai_service
        env:
          PYTHONUTF8: "1"
          LLM_BACKEND: gemini
          DB_HOST: 127.0.0.1
          DB_PORT: "1"
        run: python eval_agent.py --judge gemini --min 80 --history --pause 1.5
      - name: Lưu kết quả theo commit
        if: env.GEMINI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-gemini-${{ github.sha }}
          path: |
            ai_service/eval/last_result.json
            ai_service/eval/history/
          if-no-files-found: ignore
          retention-days: 90
      - name: Không có secret GEMINI_API_KEY
        if: env.GEMINI_API_KEY == ''
        run: echo "Bỏ qua eval Gemini (chưa đặt secret GEMINI_API_KEY)."
