<!-- Widget Trợ lý AI — gọi qua proxy Flask /api/chat (server gọi AI service) -->
<div id="naliChatWidget" data-endpoint="{{ url_for('api.chat_proxy') }}">
    <button id="naliChatToggle" aria-label="Mở trợ lý AI"><i class="fas fa-robot"></i><span class="nali-chat-badge">AI</span></button>
    <div id="naliChatBox" class="nali-hidden">
        <div class="nali-chat-header">
            <div class="nali-chat-title"><span class="nali-avatar">🦷</span>
                <div><strong>NALI Trợ Lý</strong><small>Chatbot LLM • Sẵn sàng hỗ trợ</small></div></div>
            <button id="naliChatClose" aria-label="Đóng">&times;</button>
        </div>
        <div id="naliChatBody" class="nali-chat-body"></div>
        <div class="nali-quick" id="naliQuick">
            <button class="nali-chip" data-msg="Cho tôi xem bảng giá dịch vụ">💰 Bảng giá</button>
            <button class="nali-chip" data-msg="Tôi muốn đặt lịch khám">📅 Đặt lịch</button>
            <button class="nali-chip" data-msg="Phòng khám làm việc mấy giờ?">🕗 Giờ mở cửa</button>
        </div>
        <form id="naliChatForm" class="nali-chat-input">
            <input id="naliChatText" type="text" placeholder="Nhập câu hỏi cho NALI…" autocomplete="off" />
            <button type="submit" aria-label="Gửi"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>
<style>
#naliChatWidget { position: fixed; right: 22px; bottom: 22px; z-index: 9999; }
#naliChatToggle { width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg,#4da6ff,#3d8fe8); color: #fff; font-size: 1.6rem; position: relative;
    box-shadow: 0 8px 22px rgba(77,166,255,.45); transition: transform .2s; }
#naliChatToggle:hover { transform: scale(1.08); }
.nali-chat-badge { position: absolute; top: -4px; right: -4px; background: #ff6b6b; color: #fff; font-size: .62rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; }
#naliChatBox { position: absolute; right: 0; bottom: 78px; width: 360px; max-width: calc(100vw - 32px); height: 520px;
    max-height: calc(100vh - 120px); background: #fff; border-radius: 18px; box-shadow: 0 16px 48px rgba(0,0,0,.22);
    display: flex; flex-direction: column; overflow: hidden; }
.nali-hidden { display: none !important; }
.nali-chat-header { background: linear-gradient(135deg,#4da6ff,#3d8fe8); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
.nali-chat-title { display: flex; align-items: center; gap: 10px; }
.nali-avatar { width: 38px; height: 38px; background: rgba(255,255,255,.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.nali-chat-title small { display: block; opacity: .85; font-size: .72rem; }
#naliChatClose { background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; }
.nali-chat-body { flex: 1; overflow-y: auto; padding: 14px; background: #f5f9ff; }
.nali-msg { margin-bottom: 12px; display: flex; }
.nali-msg .bubble { padding: 10px 13px; border-radius: 14px; max-width: 82%; font-size: .9rem; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
.nali-msg.bot .bubble { background: #fff; color: #333; border: 1px solid #e3eefc; border-bottom-left-radius: 4px; }
.nali-msg.user { justify-content: flex-end; }
.nali-msg.user .bubble { background: linear-gradient(135deg,#4da6ff,#3d8fe8); color: #fff; border-bottom-right-radius: 4px; }
.nali-typing .bubble { color: #888; font-style: italic; }
.nali-quick { padding: 8px 12px 0; display: flex; gap: 6px; flex-wrap: wrap; background: #f5f9ff; }
.nali-chip { border: 1px solid #cfe4ff; background: #fff; color: #3d8fe8; border-radius: 16px; padding: 5px 10px; font-size: .78rem; cursor: pointer; }
.nali-chat-input { display: flex; padding: 10px 12px; gap: 8px; background: #fff; border-top: 1px solid #eef3fa; }
.nali-chat-input input { flex: 1; border: 1px solid #d9e6f7; border-radius: 20px; padding: 10px 14px; font-size: .9rem; outline: none; }
.nali-chat-input button { border: none; background: #4da6ff; color: #fff; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; }
[data-theme="dark"] #naliChatBox { background: #1e293b; }
[data-theme="dark"] .nali-chat-body, [data-theme="dark"] .nali-quick { background: #0f172a; }
[data-theme="dark"] .nali-msg.bot .bubble { background: #1e293b; color: #e2e8f0; border-color: #334155; }
[data-theme="dark"] .nali-chat-input { background: #1e293b; border-color: #334155; }
[data-theme="dark"] .nali-chat-input input { background: #0f172a; border-color: #334155; color: #e2e8f0; }
@media (max-width: 480px) { #naliChatBox { width: calc(100vw - 24px); } }
</style>
<script>
(function () {
    var root=document.getElementById('naliChatWidget'), EP=root.getAttribute('data-endpoint');
    var box=document.getElementById('naliChatBox'), body=document.getElementById('naliChatBody');
    var form=document.getElementById('naliChatForm'), input=document.getElementById('naliChatText'); var greeted=false;
    var sid=localStorage.getItem('nali_sid')||('web-'+Math.random().toString(36).slice(2,10)); localStorage.setItem('nali_sid',sid);
    function render(t){var e=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return e.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
    function add(t,who){var w=document.createElement('div');w.className='nali-msg '+who;w.innerHTML='<div class="bubble">'+render(t)+'</div>';body.appendChild(w);body.scrollTop=body.scrollHeight;return w;}
    async function send(m){add(m,'user');input.value='';var tp=add('NALI đang soạn trả lời…','bot');tp.classList.add('nali-typing');
        try{var r=await fetch(EP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:m})});
            var d=await r.json();tp.remove();add(d.reply||'Xin lỗi, NALI chưa trả lời được ạ.','bot');}
        catch(e){tp.remove();add('⚠️ Không kết nối được trợ lý AI ạ.','bot');}}
    function open(){box.classList.remove('nali-hidden');if(!greeted){greeted=true;add('Xin chào 👋 NALI là trợ lý AI của Nha khoa NALI. Em có thể tư vấn dịch vụ, báo giá và đặt lịch giúp anh/chị ạ!','bot');}input.focus();}
    document.getElementById('naliChatToggle').addEventListener('click',function(){box.classList.contains('nali-hidden')?open():box.classList.add('nali-hidden');});
    document.getElementById('naliChatClose').addEventListener('click',function(){box.classList.add('nali-hidden');});
    form.addEventListener('submit',function(e){e.preventDefault();var m=input.value.trim();if(m)send(m);});
    document.getElementById('naliQuick').addEventListener('click',function(e){var c=e.target.closest('.nali-chip');if(c)send(c.getAttribute('data-msg'));});
})();
</script>
