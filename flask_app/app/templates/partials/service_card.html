{% macro service_card(p) %}
<a class="service-card" href="{{ url_for('main.service_detail', pid=p.id) }}" style="text-decoration:none;color:inherit;">
    <div class="service-thumb">
        <img src="{{ url_for('static', filename='images/' ~ service_card_image(p.target_group, p.name)) }}" alt="{{ p.name }}" loading="lazy"
             onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/logo.png') }}';">
    </div>
    <div class="service-card-content">
        <div class="svc-meta">
            <span class="dur"><i class="far fa-clock"></i> {{ p.duration }}′</span>
        </div>
        <h3>{{ p.name }}</h3>
        <p>{{ p.description }}</p>
        <div class="svc-foot">
            <div class="price-box">
                {% if p.price and p.price|float > 0 %}
                    <small>Chỉ từ</small><span class="price">{{ '{:,.0f}'.format(p.price|float).replace(',', '.') }}đ</span>
                {% else %}
                    <span class="price free">Miễn phí tư vấn</span>
                {% endif %}
            </div>
            <span class="order-btn"><i class="fas fa-calendar-check"></i> Chi tiết</span>
        </div>
    </div>
</a>
{% endmacro %}
