{% extends 'base.html' %}
{% block title %}Lỗi {{ code }} — NALI Dental{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;">
  <div style="font-size:5rem;">🦷</div>
  <h1 style="font-size:3rem;font-weight:800;color:var(--nali);margin:10px 0;">{{ code }}</h1>
  <p style="color:#64748b;font-size:1.1rem;margin-bottom:24px;max-width:520px;">{{ msg }}</p>
  <a href="{{ url_for('main.index') }}" class="btn-hero primary" style="color:#fff;background:linear-gradient(135deg,var(--nali),var(--nali-dark));"><i class="fas fa-home"></i> Về trang chủ</a>
</div>
{% endblock %}
